version: 1
provider:
  name: thousandeyes
  registry_namespace: deploymenttheory
generator:
  version: v0.5.0
spec:
  document_url: https://pubhub.devnetcloud.com/media/000-v7-apis/docs/reference/unified-oas/api.yaml
sdk:
  backend: kiota
  backend_version: "1.34.1"
  client_type_name: ThousandEyesClient
auth:
  method: bearer_token
audit:
  enabled: true
  base_url_override: https://api.thousandeyes.com/v7
  name_prefix: tfpfgen
  max_objects: 25
  rate_limit_rps: 6
  # Applied without a pull request: the list envelope is a structural
  # fact the generator needs, read straight off the live response.
  auto_accept: [listResponseShape]
